[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "receiver-serial-controller"
version = "0.2.0"
description = "Protocol-independent MQTT controller for RS-232 audio receivers"
requires-python = ">=3.11"
dependencies = [
    "pyserial>=3.5",
    "paho-mqtt>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[project.scripts]
receiverctl = "receiverctl.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
